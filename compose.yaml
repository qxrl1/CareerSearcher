services:
  app-api:
    container_name: careersearcher-api
    build:
      dockerfile: Dockerfile
      context: .
    ports:
      - 8080:8080
    depends_on: ["app-db"]
    environment:
      - "ConnectionStrings__SqlConnection=Data Source=app-db,1433;Initial Catalog=${DB_NAME};User ID=sa;Password=${DB_PASSWORD};Connect Timeout=30;Encrypt=False;Trust Server Certificate=True;Application Intent=ReadWrite;Multi Subnet Failover=False;Command Timeout=30"
      - "WebhookUrl=${WEBHOOK_URL}"
    networks:
      careersearcher-network:
    
  app-db:
    container_name: app-db
    image: mcr.microsoft.com/mssql/server:2025-latest
    ports:
      - 1433:1433
    environment:
      - "ACCEPT_EULA=Y"
      - "MSSQL_SA_PASSWORD=${DB_PASSWORD}" 
      - "MSSQL_DB=${DB_NAME}"
    volumes:
      - careersearcher-mssql-volume:/var/opt/mssql
    networks:
      careersearcher-network:
        aliases:
          - "sql" 

volumes:
  careersearcher-mssql-volume:

networks:
  careersearcher-network:
    driver: bridge
